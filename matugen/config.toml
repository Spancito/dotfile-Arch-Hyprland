[config]
reload_apps = true
prefer = "saturation"

[templates.hyprland]
input_path = '~/.config/hypr/colors/matugen.lua'
output_path = '~/.config/hypr/colors/colors.lua'
post_hook = 'hyprctl reload'

[templates.hyprland-conf]
input_path = '~/.config/matugen/templates/hyprland-colors.conf'
output_path = '~/.config/hypr/colors/matugen.conf'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi-colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.vesktop]
input_path = '~/.config/matugen/templates/midnight.theme.css'
output_path = '~/.config/vesktop/themes/blur.theme.css'

[templates.micro]
input_path = '~/.config/matugen/templates/micro-colors.micro'
output_path = '~/.config/micro/colorschemes/matugen.micro'

[templates.zed]
input_path = '~/.config/matugen/templates/zed-colors.json'
output_path = '~/.config/zed/themes/matugen.json'

[templates.vscode]
input_path = '~/.config/matugen/templates/vscode-colors.json'
output_path = '~/.config/matugen/vscode-colors-generated.json'
post_hook = 'python ~/.config/matugen/scripts/update_vscode_theme.py'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.papirus]
input_path = '~/.config/matugen/templates/papirus_color.sh'
output_path = '~/.config/matugen/scripts/run_papirus.sh'
post_hook = 'bash ~/.config/matugen/scripts/run_papirus.sh >/dev/null 2>&1 &'

[templates.hyprcursor]
input_path = '~/.config/matugen/templates/hyprcursor_color.sh'
output_path = '~/.config/matugen/scripts/run_hyprcursor.sh'
post_hook = 'bash ~/.config/matugen/scripts/run_hyprcursor.sh >/dev/null 2>&1 &'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'

[templates.spicetify]
input_path = '~/.config/matugen/templates/spicetify-colors.css'
output_path = '~/.config/spicetify/Themes/Matugen/colors.css'

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim-colors.lua'
output_path = '~/.config/nvim/colors/matugen.lua'

[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell-colors.json'
output_path = '~/.config/quickshell/colors.json'

